<head>
    <meta charset="utf-8">
    <title>PilotProjectStudy2026</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

    <!-- this would link to our own css file lets do seperately -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-title">
            <h1>Pierce County Pilot Study</h1>
            <p>Residential Building Identification</p>
        </div>

        <div class="nav-right">
            <div class="nav-search">
                <input type="text" placeholder="Search address or parcel...">
                <button>Search</button>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="active">Map</a>
                <a href="data.html">Project & Data</a>
            </nav>
        </div>
    </header>
    <!-- End navigation Bar -->


    <div class="main-container">
        <!-- Left building information panel -->
        <aside class="container" id="sidebar">

            <h2>Building Information</h2>

            <!-- reset the map to original -->
            <button id="reset-map">Reset Map</button>

            <div class="building-photo">
                <!-- note: just in case i cant find this line highlighthighlighthighlight -->
                <!-- <img src="assets/building-placeholder.jpg"
                    alt="Building photo"> -->
                <img id="building-photo"
                     src="assets/building-placeholder.jpg"
                     alt="Building photo"
            </div>

            <div class="building-details">
                <h3>Property Address</h3>
                <p id="address">Select a building on the map</p>

                <div id="parcel-details" hidden>
                    <p>Parcel Number: <span id="selected-parcel-number"></span></p>
                    <!-- add: HVAC info appears when parcel being select -->
                    <p>HVAC Description: <span id="selected-hvac"></span></p>
                </div>

                <a id="google-maps-link"
                href="#"
                target="_blank">
                    View on Google Maps
                </a>
            </div>

            <div class="parcel-directory">
                <h3>Candidate Parcels</h3>
                <p id="parcel-count">Loading parcels...</p>

                <div id="parcel-list"></div>
            </div>
            <div id="sidebar-resizer"></div>
        </aside>
        <!-- End left building information panel -->

        <!-- Map -->
        <div id="map"></div>

    </div>



<div id="map"></div>




    <!-- this would link to our js functions -->
    <script src="js/main.js"></script>
